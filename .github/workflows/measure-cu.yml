name: Vérification on-chain et mesure du coût

# Pourquoi cette CI existe : la toolchain Solana ne s'installe pas de façon
# fiable dans notre environnement de développement (débit trop faible, builds
# trop longs). Les runners GitHub, eux, ont le réseau et le temps qu'il faut.
# C'est donc ici que le chiffre MESURÉ sera produit — pas sur un poste.

on:
  push:
    paths: ["solana-program/**", ".github/workflows/measure-cu.yml"]
  pull_request:
    paths: ["solana-program/**"]
  workflow_dispatch:

jobs:
  build-and-measure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solana-program

    steps:
      - uses: actions/checkout@v4

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            solana-program/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('solana-program/Cargo.toml') }}

      - name: Installer la CLI Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          rustc --version
          solana --version
          cargo-build-sbf --version

      # Construit le .so que Mollusk chargera.
      - name: Construire le programme (SBF)
        run: cargo-build-sbf

      # `--nocapture` : sans ça, le println! du coût mesuré n'apparaît pas.
      - name: Mesurer le coût en unités de calcul
        run: cargo test --test cu_benchmark -- --nocapture

      - name: Extraire le chiffre dans le résumé
        if: always()
        run: |
          cargo test --test cu_benchmark -- --nocapture 2>&1 \
            | grep -E "COÛT MESURÉ|part du plafond|calcul théorique" \
            | sed 's/^/    /' > /tmp/cu.txt || true
          {
            echo "### Coût de vérification mesuré"
            echo ''
            echo '```'
            cat /tmp/cu.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: programme-sbf
          path: solana-program/target/deploy/*.so
          if-no-files-found: warn
