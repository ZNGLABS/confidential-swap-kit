name: Vérification on-chain et mesure du coût

on:
  push:
    paths: ["solana-program/**", "devnet/**", ".github/workflows/measure-cu.yml"]
  pull_request:
    paths: ["solana-program/**", "devnet/**"]
  workflow_dispatch:

jobs:
  build-and-measure:
    runs-on: ubuntu-latest
    env:
      SBF_OUT_DIR: ${{ github.workspace }}/solana-program/target/deploy
    defaults:
      run:
        working-directory: solana-program
    steps:
      - uses: actions/checkout@v4
      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            solana-program/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('solana-program/Cargo.toml') }}
      - name: Installer la CLI Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Versions
        run: |
          rustc --version
          solana --version
          cargo-build-sbf --version
      - name: Construire le programme (SBF)
        run: cargo-build-sbf
      - name: Taille du binaire
        run: ls -la target/deploy/*.so
      - name: Mesurer le coût en unités de calcul
        run: cargo test --test cu_benchmark -- --nocapture
      - name: Extraire le chiffre dans le résumé
        if: always()
        run: |
          cargo test --test cu_benchmark -- --nocapture 2>&1 \
            | grep -E "COÛT MESURÉ|part du plafond|écart calcul" \
            | sed 's/^/    /' > /tmp/cu.txt || true
          {
            echo "### Coût de vérification mesuré"
            echo ''
            echo '```'
            cat /tmp/cu.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: programme-sbf
          path: solana-program/target/deploy/*.so
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────
  # Cycle complet sur devnet : déploiement, 2 dépôts, une dépense
  # confidentielle, puis contrôle que la rejouer échoue.
  #
  # ⚠️ FINANCEMENT. Le robinet devnet public REFUSE les IP de datacenter :
  # testé le 9 août 2026, 6 tentatives, 0 SOL obtenu. Il faut donc fournir une
  # clé déjà alimentée via le secret de dépôt DEVNET_KEYPAIR (le contenu de
  # id.json, un tableau de 64 entiers). Sans ce secret, le job retombe sur
  # l'airdrop et échouera probablement — c'est pourquoi il est en
  # continue-on-error : il ne doit pas faire passer le dépôt au rouge.
  #
  # La clé doit être une clé JETABLE réservée au devnet, sans aucun fonds
  # mainnet. Compter ~3 SOL de devnet pour le déploiement.
  # ─────────────────────────────────────────────────────────────────────
  devnet:
    needs: build-and-measure
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer la CLI Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Construire le programme (SBF)
        working-directory: solana-program
        run: |
          cargo-build-sbf
          ls -la target/deploy/*.so

      - name: Provisionner la clé
        id: fonds
        env:
          DEVNET_KEYPAIR: ${{ secrets.DEVNET_KEYPAIR }}
        run: |
          solana config set --url https://api.devnet.solana.com
          mkdir -p ~/.config/solana
          if [ -n "$DEVNET_KEYPAIR" ]; then
            printf '%s' "$DEVNET_KEYPAIR" > ~/.config/solana/id.json
            echo "source=secret de depot"
          else
            echo "::warning::aucun secret DEVNET_KEYPAIR — tentative d'airdrop (echoue en general depuis un runner)"
            solana-keygen new --no-bip39-passphrase --silent --force
            for i in 1 2 3; do solana airdrop 2 || true; sleep 10; done
          fi
          echo "payeur=$(solana address)" >> "$GITHUB_OUTPUT"
          SOLDE=$(solana balance | awk '{print $1}')
          echo "solde=$SOLDE" >> "$GITHUB_OUTPUT"
          echo "solde : $SOLDE SOL"
          if awk "BEGIN{exit !($SOLDE < 2)}"; then
            echo "::error::solde insuffisant ($SOLDE SOL). Alimenter la cle via https://faucet.solana.com puis relancer."
            exit 1
          fi

      - name: Déployer sur devnet
        id: deploy
        working-directory: solana-program
        run: |
          OUT=$(solana program deploy target/deploy/nexa_verifier.so --output json)
          echo "$OUT"
          PID=$(echo "$OUT" | python3 -c "import sys,json;print(json.load(sys.stdin)['programId'])")
          echo "programId=$PID" >> "$GITHUB_OUTPUT"

      - name: Jouer le cycle complet
        working-directory: devnet
        run: |
          npm install --no-audit --no-fund
          node run.js "${{ steps.deploy.outputs.programId }}" | tee /tmp/devnet.txt

      - name: Résumé
        if: always()
        run: |
          {
            echo "### Cycle complet sur devnet"
            echo ''
            echo "- payeur : `${{ steps.fonds.outputs.payeur }}`"
            echo "- solde : ${{ steps.fonds.outputs.solde }} SOL"
            echo "- programme : `${{ steps.deploy.outputs.programId }}`"
            echo ''
            echo '```'
            tail -40 /tmp/devnet.txt 2>/dev/null || echo "(le cycle n a pas pu s executer)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
