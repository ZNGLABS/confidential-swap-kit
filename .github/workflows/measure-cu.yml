name: Vérification on-chain et mesure du coût

# Pourquoi cette CI existe : la toolchain Solana ne s'installe pas de façon
# fiable dans notre environnement de développement (débit trop faible, builds
# trop longs). Les runners GitHub, eux, ont le réseau et le temps qu'il faut.

on:
  push:
    paths: ["solana-program/**", "devnet/**", ".github/workflows/measure-cu.yml"]
  pull_request:
    paths: ["solana-program/**", "devnet/**"]
  workflow_dispatch:

jobs:
  build-and-measure:
    runs-on: ubuntu-latest
    env:
      SBF_OUT_DIR: ${{ github.workspace }}/solana-program/target/deploy
    defaults:
      run:
        working-directory: solana-program

    steps:
      - uses: actions/checkout@v4
      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            solana-program/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('solana-program/Cargo.toml') }}
      - name: Installer la CLI Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Versions
        run: |
          rustc --version
          solana --version
          cargo-build-sbf --version
      - name: Construire le programme (SBF)
        run: cargo-build-sbf
      - name: Verifier que le binaire existe
        run: ls -la target/deploy/
      - name: Mesurer le coût en unités de calcul
        run: cargo test --test cu_benchmark -- --nocapture
      - name: Extraire le chiffre dans le résumé
        if: always()
        run: |
          cargo test --test cu_benchmark -- --nocapture 2>&1 \
            | grep -E "COÛT MESURÉ|part du plafond|écart calcul" \
            | sed 's/^/    /' > /tmp/cu.txt || true
          {
            echo "### Coût de vérification mesuré"
            echo ''
            echo '```'
            cat /tmp/cu.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: programme-sbf
          path: solana-program/target/deploy/*.so
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────────────────
  # Le cycle complet sur devnet : déploiement, 2 dépôts, une dépense
  # confidentielle, puis contrôle que la rejouer échoue.
  #
  # continue-on-error : le robinet devnet public refuse souvent les IP de
  # datacenter. Un échec ici ne doit pas faire passer le dépôt au rouge,
  # mais il doit être visible dans le résumé.
  # ─────────────────────────────────────────────────────────────────────
  devnet:
    needs: build-and-measure
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer la CLI Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Construire le programme (SBF)
        working-directory: solana-program
        run: |
          cargo-build-sbf
          ls -la target/deploy/
          du -h target/deploy/nexa_verifier.so

      - name: Clé jetable + provision devnet
        id: fonds
        run: |
          solana config set --url https://api.devnet.solana.com
          solana-keygen new --no-bip39-passphrase --silent --force
          echo "payeur=$(solana address)" >> "$GITHUB_OUTPUT"
          # le robinet public est capricieux : on insiste raisonnablement
          for i in 1 2 3 4 5 6; do
            solana airdrop 2 || true
            sleep 12
            SOLDE=$(solana balance | awk '{print $1}')
            echo "tentative $i — solde : $SOLDE SOL"
            if awk "BEGIN{exit !($SOLDE >= 5)}"; then break; fi
          done
          echo "solde=$(solana balance | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Déployer sur devnet
        id: deploy
        working-directory: solana-program
        run: |
          OUT=$(solana program deploy target/deploy/nexa_verifier.so --output json)
          echo "$OUT"
          PID=$(echo "$OUT" | python3 -c "import sys,json;print(json.load(sys.stdin)['programId'])")
          echo "programId=$PID" >> "$GITHUB_OUTPUT"
          echo "programme déployé : $PID"

      - name: Jouer le cycle complet
        id: cycle
        working-directory: devnet
        run: |
          npm install --no-audit --no-fund
          node run.js "${{ steps.deploy.outputs.programId }}" | tee /tmp/devnet.txt

      - name: Résumé
        if: always()
        run: |
          {
            echo "### Cycle complet sur devnet"
            echo ''
            echo "- payeur : `${{ steps.fonds.outputs.payeur }}` (clé jetable, détruite avec le runner)"
            echo "- solde obtenu : ${{ steps.fonds.outputs.solde }} SOL"
            echo "- programme : `${{ steps.deploy.outputs.programId }}`"
            echo ''
            echo '```'
            tail -30 /tmp/devnet.txt 2>/dev/null || echo "(le cycle n'a pas pu s'exécuter — voir les étapes ci-dessus)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
