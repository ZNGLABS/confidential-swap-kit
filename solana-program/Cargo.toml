[package]
name = "nexa-verifier"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Vérification on-chain d'une preuve Groth16 du circuit NEXA pour.circom"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

# groth16-solana 0.2 ne dépend plus de solana-program mais de solana-bn254,
# il est donc indépendant de la version du SDK.
[dependencies]
solana-program = "4.1"
groth16-solana = "0.2"

# Mollusk 0.14 utilise les crates Solana éclatées (solana-pubkey, solana-account,
# solana-instruction) et non plus solana-sdk. Les versions ci-dessous sont
# exactement celles qu'il déclare — les désaligner produit deux types `Pubkey`
# incompatibles, et une erreur de compilation incompréhensible.
[dev-dependencies]
mollusk-svm = "0.14"
solana-instruction = "3.2"
solana-pubkey = "4.1"
solana-account = "4.3"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
